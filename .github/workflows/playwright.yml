name: Playwright Tests

on:
  schedule:
    # GitHub cron runs in UTC. 17:00 UTC = 20:00 (8pm) East Africa Time (UTC+3), every Friday.
    - cron: '0 17 * * 5'
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Restore Allure trend history
        if: ${{ !cancelled() }}
        # History lives on the published Pages site. The first run (or a run
        # before Pages is enabled) has nothing to download, which is fine.
        run: |
          mkdir -p allure-history
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          curl -fsSL "https://${owner}.github.io/${repo}/history.jsonl" -o allure-history/history.jsonl             || { echo "No previous history found, starting fresh"; rm -f allure-history/history.jsonl; }

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          npm run allure:generate
          # Publish history next to the report so the next run can restore it
          cp allure-history/history.jsonl allure-report/history.jsonl

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload traces and videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload Pages artifact
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  publish:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
